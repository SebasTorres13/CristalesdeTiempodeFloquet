project:
  type: book
  output-dir: docs

book:
  title: "Cristales de Tiempo de Floquet"
  author: "Mario sebastián Torres Rubio"
  date: 28/4/2026
  chapters:
    - index.qmd
    - intro.qmd
    - teoria.qmd
    - metodos.qmd
    - simulaciones.qmd
    - summary.qmd
    - references.qmd
    
bibliography: references.bib

format:
  html:
    theme:
      light: superhero
      dark: superhero
    
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              ket: ["\\left|{#1}\\right\\rangle", 1],
              bra: ["\\left\\langle{#1}\\right|", 1],
              braket: ["\\left\\langle{#1}\\middle|{#2}\\right\\rangle", 2],
              sigma: "\\sigma"
            }
          }
        };
        </script>  
    fontsize: 0.8em
    css: styles.css
    code-fold: true
    code-summary: "Mostrar código"
    code-line-numbers: true
    code-copy: true
  pdf:
    documentclass: scrreprt




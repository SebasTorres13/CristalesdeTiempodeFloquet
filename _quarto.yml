project:
  type: book
  output-dir: docs

book:
  title: "Cristales de Tiempo de Floquet"
  author: "Mario Sebastián Torres Rubio"
  date: "2026-04-28" 
  date-format: "long" 
  chapters:
    - index.qmd
    - intro.qmd
    - teoria.qmd
    - metodos.qmd
    - Floquet_Time_Crystals.ipynb
    - Time_crystals_definitivo.ipynb
    - summary.qmd
    - references.qmd
    
bibliography: references.bib

format:
  html:
    # --- CONFIGURACIÓN DE MODO OSCURO Y COLOR ---
    theme:
      light: cosmo      # Tema limpio y claro por defecto
      dark: superhero   # Tema oscuro cuando el usuario activa el interruptor
    
    # --- CONFIGURACIÓN DE MATHJAX ---
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              ket: ["\\left|{#1}\\right\\rangle", 1],
              bra: ["\\left\\langle{#1}\\right|", 1],
              braket: ["\\left\\langle{#1}\\middle|{#2}\\right\\rangle", 2],
              sigma: "\\sigma"
            }
          }
        };
        </script>  
    
    # --- ESTILOS ADICIONALES ---
    fontsize: 0.8em
    css: styles.css
    
    # --- CONFIGURACIÓN DE CÓDIGO ---
    code-fold: true
    code-summary: "Mostrar código"
    code-line-numbers: true
    code-copy: true



